function nsync(){if(net.np==3)return nsync3();if(net.tc>0)net.tc--;if(net.tc>0||!net.am||net.am.length<12||G.ko)return 0;

{const q=F[li],v=net.vo[li];let dx=ox+v[0]-q.x,dy=oy+v[1]-q.y;if(Math.abs(dx)>90||Math.abs(dy)>90)dx=dy=0;v[0]=dx;v[1]=dy}
