function chFind(s){s=String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!s)return -1;if(/^\d+$/.test(s)){const i=+s-1;return i>=0&&i<CH.length?i:-1}
let i=CH.findIndex(c=>c.id==s);if(i<0)i=CH.findIndex(c=>c.n.toLowerCase().replace(/[^a-z0-9]/g,'').includes(s));return i}
function setOwn(a,ids,take){const got=[];for(const id of ids){const i=CH.findIndex(c=>c.id==id);if(i<0||!CH[i].k)continue;if(take){if(a[CH[i].k]){delete a[CH[i].k];const Q=QS.find(q=>q.c==i);if(Q&&Q.s)a[Q.s]=null;got.push(CH[i].n)}}else if(!a[CH[i].k]){a[CH[i].k]=1;got.push(CH[i].n)}}LS.set('ac_accts',accts);return got}
function gift(m){const a=user&&accts[user];if(!a||!Array.isArray(m.c))return;const got=setOwn(a,m.c.map(String),m.take);if(!got.length)return;const t=(m.take?'ADMIN '+m.by+' REMOVED ':'ADMIN '+m.by+' GAVE YOU ')+got.join(', ');toast={m:t.toUpperCase(),t:360};say(t)}
const ACMD={
help:()=>say('admin <code>       turn on admin for this account\nunadmin            turn admin off\nchars              list fighters and who owns what\ngive <fighter|all> [player]   unlock a fighter (no quest needed)\ntake <fighter|all> [player]   remove an unlocked fighter\nplayers            who is online on the server\nclear              clear this log\nFighters: '+CH.map((c,i)=>(i+1)+'='+c.id).join('  ')),
admin:(c)=>{const a=user&&accts[user];if(!a)return say('Log in with an account first (guests cannot be admin).');if(c!==ADMIN_CODE)return say('Wrong admin code.');a.adm=1;a.adk=c;LS.set('ac_accts',accts);say('Admin ON for '+a.n+'. Type help.');if(net.st=='online')nsend({t:'admin',key:c})},
unadmin:()=>{const a=user&&accts[user];if(a){delete a.adm;delete a.adk;LS.set('ac_accts',accts)}say('Admin OFF.')},
chars:()=>{const a=user&&accts[user];CH.forEach((c,i)=>say((i+1)+'  '+c.id.padEnd(8)+c.n.padEnd(16)+(c.k?(own(i,a||null)?'UNLOCKED':'LOCKED (quest: '+c.q+')'):'free')))},
players:()=>say(net.st=='online'?'Online: '+((net.ol||[]).join(', ')||'-'):'Not connected to a server.'),
clear:()=>{alog.textContent=''},
give:(c,p)=>giveCmd(c,p,false),take:(c,p)=>giveCmd(c,p,true)};
function giveCmd(c,p,take){const me=user&&accts[user];if(!me||!me.adm)return say('Admins only. Use: admin <code>');if(!c)return say('Usage: '+(take?'take':'give')+' <fighter|all> [player]');
let ids;if(c.toLowerCase()=='all')ids=CH.filter(q=>q.k).map(q=>q.id);else{const i=chFind(c);if(i<0)return say('No fighter "'+c+'". Type chars.');if(!CH[i].k)return say(CH[i].n+' is free for everyone already.');ids=[CH[i].id]}
const tk=p?p.toLowerCase():user,tgt=accts[tk];
if(tgt){const got=setOwn(tgt,ids,take);say(got.length?(take?'Removed ':'Gave ')+got.join(', ')+(take?' from ':' to ')+tgt.n+(tk==user?' (you)':'')+'.':'Nothing changed - '+tgt.n+(take?' did not have it.':' already has it.'));return}
if(net.st!='online')return say('No account "'+p+'" on this device, and not connected to a server.');
nsend({t:'give',to:p,c:ids,take});say('Sending to '+p+' via the server...')}
acmd.addEventListener('keydown',ev=>{if(ev.key=='Escape'){ev.preventDefault();conToggle(false);return}
if(ev.key=='ArrowUp'||ev.key=='ArrowDown'){ev.preventDefault();ahi=Math.max(0,Math.min(ahist.length,ahi+(ev.key=='ArrowUp'?-1:1)));acmd.value=ahist[ahi]||'';return}
if(ev.key!='Enter')return;const line=acmd.value.trim().replace(/^\//,'');acmd.value='';if(!line)return;ahist.push(line);ahi=ahist.length;say('> '+line);
const[cmd,...args]=line.split(/\s+/),fn=ACMD[cmd.toLowerCase()];if(fn)fn(...args);else say('Unknown command. Type help.')});
FFA=!!LS.get('ac_ffa');
const last0=LS.get('ac_last');if(last0&&accts[last0]){user=last0;wel=150;show('main');setTimeout(news,300)}else{if(last0)un.value=last0;show('login')}
if(user&&accts[user]&&LS.get('ac_server'))nconn();
setInterval(()=>{if(net.st=='online')nsend({t:'ping',ts:performance.now()});if(net.p3)for(const k in net.p3){const d=net.p3[k].dc;if(d&&d.readyState=='open'){try{d.send(JSON.stringify({t:'dp',ts:performance.now()}))}catch(e){}}}if(net.dc&&net.dc.readyState=='open'){try{net.dc.send(JSON.stringify({t:'dp',ts:performance.now()}))}catch(e){}}},500);
